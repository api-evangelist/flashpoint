aid: flashpoint
name: Flashpoint
description: >-
  Flashpoint is a threat intelligence company delivering decisive intelligence for
  cybersecurity, fraud prevention, corporate and physical security, vulnerability
  management, insider threat, and national security teams. Its Ignite platform and
  Flashpoint API surface data collected from illicit online communities, the deep and
  dark web, chat services, and open sources — exposing threat actors, compromised
  credentials, vulnerabilities, and fraud indicators. Flashpoint makes this finished
  intelligence and raw data available programmatically through a REST API at
  api.flashpoint.io, documented at docs.flashpoint.io, so security teams can integrate
  alerting, data feeds, and finished intelligence into SOC, SIEM, and security
  automation workflows.
